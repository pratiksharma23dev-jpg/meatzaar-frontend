<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="../pictures/landing_img2.png">
    <title>Meatzaar - Forgot Password</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sekuya&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <script src="../shared/config.js"></script>
    <script src="../shared/auth.js" defer></script>
    <script src="script.js" defer></script>
</head>
<body>

    <div class="page-wrapper">

        <div class="brand">
            <a href="/index.html" class="brand-link">
                <span class="brand-name">Meatzaar</span>
            </a>
        </div>

        <div class="card">
            <div class="card-icon">
                <i class="fas fa-lock"></i>
            </div>
            <h1 class="card-title">Forgot Password?</h1>
            <p class="card-subtitle">Enter your email and we'll send you a link to reset your password.</p>

            <form id="forgotForm" class="auth-form" novalidate>
                <div class="field-group">
                    <label for="email" class="field-label">Email Address</label>
                    <div class="input-wrapper">
                        <i class="fas fa-envelope input-icon"></i>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            class="field-input"
                            placeholder="you@example.com"
                            autocomplete="email"
                            required
                        >
                    </div>
                    <span class="field-error" id="emailError"></span>
                </div>

                <button type="submit" class="btn-submit" id="submitBtn">
                    <span class="btn-text">Send Reset Link</span>
                    <span class="btn-spinner hidden"><i class="fas fa-circle-notch fa-spin"></i></span>
                </button>
            </form>

            <div class="alert alert-success hidden" id="successMsg">
                <i class="fas fa-check-circle"></i>
                <span id="successText"></span>
            </div>

            <div class="alert alert-error hidden" id="errorMsg">
                <i class="fas fa-exclamation-circle"></i>
                <span id="errorText"></span>
            </div>

            <div class="card-footer">
                <a href="/index.html?action=login" class="back-link">
                    <i class="fas fa-arrow-left"></i> Back to Login
                </a>
            </div>
        </div>

    </div>

</body>
</html>
